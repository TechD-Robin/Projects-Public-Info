<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="updated" content="2025-05-29">
  <title>關於我</title>
  <style>
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --fg: #1d1d1f;
  --muted: #6e6e73;
  --rule: #d2d2d7;
  --link: #0066cc;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --fg: #f1f1f1;
    --muted: #a1a1a6;
    --rule: #3a3a3c;
    --link: #80cbc4;
  }
}
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  padding: 1.25rem 1.25rem 2.5rem;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI",
               "PingFang TC", "Hiragino Sans", "Noto Sans TC", "Noto Sans JP", sans-serif;
  font-size: 1rem;
  line-height: 1.7;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
main { max-width: 800px; margin: 0 auto; }
h1, h2, h3, h4, h5, h6 { color: var(--fg); line-height: 1.35; margin: 1.6em 0 0.6em; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.4rem; }
h3 { font-size: 1.25rem; }
h4, h5, h6 { font-size: 1.15rem; }
main > :first-child { margin-top: 0; }
p { margin: 0.75em 0; }
ul, ol { padding-left: 1.5rem; margin: 0.75em 0; }
li { margin: 0.4em 0; }
hr { border: 0; border-top: 1px solid var(--rule); margin: 1.5rem 0; }
a { color: var(--link); text-decoration: underline; text-underline-offset: 0.15em; }
strong { font-weight: 600; }
  </style>
</head>
<body>
<main>
<p>最近就是一個動森玩得有點過頭的 iOS 軟體工程師。在遊玩的過程中想到，如果能有個 App 用來記錄一些在島上與小動物們的互動狀態，好像也不錯，然後就寫了這個簡單的 App 了。</p>
<p>偶爾會回來調整一些細節，最近也順手加了一個新的資料功能。基本上是我自己在用的東西，不過如果能順便幫助到其他玩家，那也很不錯。</p>
<p>由於 App Store 不支援單純的贊助機制，因此個人選擇透過特定資料顯示限制，讓使用者可以選擇觀看廣告或付費解鎖限制的方式來支持開發。</p>
<p>無論如何，我希望這款應用能在您的使用過程中帶來幫助。如果有任何問題，歡迎隨時聯繫我。</p>
<p><strong>開發者：</strong>Robin Hsu</p>
</main>
</body>
</html>
